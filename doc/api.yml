          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Graduates ───────────────────────────────────────────────────────
  /graduates:
    get:
      tags: [Graduates]
      summary: Liste les diplômés d'un track et d'une promotion
      operationId: listGraduates
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: track
          in: query
          required: true
          schema:
            type: string
            enum: [TRONC_COMMUN, EL, TN]
          description: Track à filtrer
        - name: promotion
          in: query
          required: true
          schema:
            type: string
          description: Promotion (label de l'année académique)
      responses:
        "200":
          description: Liste des diplômés avec classement
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Graduate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /graduates/export:
    get:
      tags: [Graduates]
      summary: Exporte les diplômés d'une promotion en XLSX (via S3 presigned URL)
      operationId: exportGraduates
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: promotion
          in: query
          required: true
          schema:
            type: string
          description: Promotion (label de l'année académique)
      responses:
        "200":
          description: URL pré-signée S3 du fichier XLSX généré
          content:
            text/plain:
              schema:
                type: string
                format: uri
                description: URL pré-signée S3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
