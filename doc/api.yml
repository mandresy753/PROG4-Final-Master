  # ─── Grades ──────────────────────────────────────────────────────────
  /grades/current:
    get:
      tags: [Grades]
      summary: Récupère les notes courantes d'un étudiant
      operationId: getCurrentGrades
      security:
        - bearerAuth: []
      description: >
        ADMIN : toutes les notes.
        STUDENT : seulement ses propres notes (doit passer ?studentId=<own_id>).
        TEACHER : seulement pour les offres de cours auxquelles il est affecté.
      parameters:
        - $ref: "#/components/parameters/StudentIdQuery"
      responses:
        "200":
          description: Notes courantes de l'étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /grades/history:
    get:
      tags: [Grades]
      summary: Récupère l'historique des notes d'un étudiant pour une session
      operationId: getGradeHistory
      security:
        - bearerAuth: []
      description: >
        ADMIN : toutes les notes.
        STUDENT : seulement ses propres notes.
        TEACHER : seulement pour les offres de cours auxquelles il est affecté.
      parameters:
        - name: examSessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la session d'examen
        - $ref: "#/components/parameters/StudentIdQuery"
      responses:
        "200":
          description: Historique des notes (ordonné par entry_date DESC)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /grades/{examSessionId}:
    post:
      tags: [Grades]
      summary: Enregistre une note pour une session d'examen
      operationId: recordGrade
      security:
        - bearerAuth: [ADMIN, TEACHER]
      description: >
        ADMIN : peut toujours enregistrer une note.
        TEACHER : seulement si affecté à l'offre de cours liée à la session d'examen.
        L'utilisateur authentifié est automatiquement défini comme enteredBy.
      parameters:
        - $ref: "#/components/parameters/ExamSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordGradeRequest"
      responses:
        "201":
          description: Note enregistrée
          content:
